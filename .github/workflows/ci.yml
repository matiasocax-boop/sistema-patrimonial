# ============================================================================
# CI del frontend: lint + tests + build
# ============================================================================
# Corre en cada push a main y en cada PR. Es el chequeo requerido para que
# Vercel promueva a producción (ver .github/workflows/deploy.yml y el README).
# ============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificacion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias (lockfile exacto)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build de producción
        run: npm run build
