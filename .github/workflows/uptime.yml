# Monitoreo de uptime (costo cero): cada 15 minutos pide el frente de
# producción. Si cae, abre (o mantiene) un issue; al recuperarse lo cierra
# solo con un comentario. Sin servicios externos.
# El workflow nunca falla a propósito: es solo un notificador best-effort.
# No depende de etiquetas (el token no siempre puede crearlas).
name: uptime

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  issues: write

env:
  SITE_URL: https://sistema-patrimonial-two.vercel.app
  ISSUE_TITLE: '[downtime] El sitio no responde'

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Probar el sitio
        id: ping
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 "$SITE_URL" || echo "000")
          echo "http=$code"
          if [ "$code" = "200" ]; then echo "up=true" >> "$GITHUB_OUTPUT"; else echo "up=false" >> "$GITHUB_OUTPUT"; fi

      - name: Buscar aviso abierto
        id: buscar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          num=$(gh issue list --state open --search "El sitio no responde in:title" --json number --jq '.[0].number // empty' 2>/dev/null || echo "")
          echo "num=$num" >> "$GITHUB_OUTPUT"

      - name: Abrir o mantener aviso
        if: steps.ping.outputs.up == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "${{ steps.buscar.outputs.num }}" ]; then
            gh issue create \
              --title "$ISSUE_TITLE" \
              --body "El monitoreo detectó que $SITE_URL no responde (último chequeo: $(date -u '+%Y-%m-%d %H:%M UTC')). Revisar Vercel y Supabase." \
              || echo "no se pudo crear el aviso (se reintenta en el próximo chequeo)"
          else
            gh issue comment "${{ steps.buscar.outputs.num }}" --body "Sigue caído (chequeo: $(date -u '+%Y-%m-%d %H:%M UTC'))." \
              || echo "no se pudo comentar el aviso"
          fi

      - name: Cerrar aviso al recuperarse
        if: steps.ping.outputs.up == 'true' && steps.buscar.outputs.num != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ steps.buscar.outputs.num }}" --body "Recuperado (chequeo: $(date -u '+%Y-%m-%d %H:%M UTC')). Cierro el aviso." || true
          gh issue close "${{ steps.buscar.outputs.num }}" || echo "no se pudo cerrar el aviso"
