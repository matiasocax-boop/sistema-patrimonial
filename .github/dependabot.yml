# Dependabot: abre PRs semanales para mantener dependencias al día.
# Los tests de CI corren en cada PR, así que una actualización rota se detecta
# antes de mezclarse.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      vite-react:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "react"
          - "react-dom"
          - "@types/react*"
      utilidades:
        patterns:
          - "@fortawesome/*"
          - "@supabase/*"
          - "papaparse"
          - "qrcode"
          - "localforage"
          - "tailwindcss"
          - "autoprefixer"
          - "postcss"
